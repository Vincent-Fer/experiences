spring.application.name=TrustExpe

# Database configuration for production (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/trust_expe
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Session configuration
# Disable session cookie secure requirement for development
server.servlet.session.cookie.secure=false

# File upload and storage configuration
trust.expe.media.folder=classpath:media
trust.expe.logs.folder=classpath:logs

# Session and timer configuration
trust.expe.session.duration-minutes=30
trust.expe.timer.phase.initial=30
trust.expe.timer.phase.ai=5
trust.expe.timer.phase.final=10
trust.expe.session.min-between-sessions-hours=60
trust.expe.session.min-between-feedback-hours=12
trust.expe.session.ak-between-sessions=12

# Upload file size limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Hibernate settings for PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
