# Server
server.port=8080

# Database - Using H2 file-based database
spring.datasource.url=jdbc:h2:file:./backend/experience3db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Session
spring.session.timeout=30m

# Logging
logging.level.com.experience3=DEBUG

# File paths
app.image-folder=C:\\Users\\Vincent\\GitProject\\experiences\\Experience_3_SpringVue\\media
app.log-folder=C:\\Users\\Vincent\\GitProject\\experiences\\Experience_3_SpringVue\\logs

# Game settings
app.phase-timers.initial=30
app.phase-timers.ai=5
app.phase-timers.final=10
app.inter-session-hours=60
app.time-feedback-hours=12
app.min-to-del-timer=10